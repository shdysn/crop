<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>
<title>Multiple Images Cropper</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, sans-serif;
    color: #1e293b;
    background: #f1f5f9;
}

.container {
    width: 100%;
    max-width: 1400px;
    margin: auto;
}

h1 {
    margin: 0 0 10px;
    font-size: 26px;
}

.info {
    padding: 10px;
    margin-bottom: 10px;
    border-left: 4px solid #2563eb;
    border-radius: 5px;
    background: #dbeafe;
    line-height: 1.5;
}

.toolbar {
    position: sticky;
    top: 0;
    z-index: 10;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 7px;

    padding: 7px;
    margin-bottom: 8px;

    border-radius: 8px;
    background: rgba(241, 245, 249, 0.96);
}

button,
.file-button {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 45px;
    padding: 9px;

    border: 0;
    border-radius: 7px;

    color: white;
    background: #2563eb;

    font: 600 14px Arial;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
}

button:hover,
.file-button:hover {
    background: #1d4ed8;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.danger {
    background: #dc2626;
}

.secondary {
    background: #475569;
}

.success {
    background: #059669;
}

.success:hover {
    background: #047857;
}

input[type="file"] {
    display: none;
}

.status {
    margin: 8px 0;
    font-size: 14px;
    font-weight: bold;
}

/* Main image area */
.stage {
    display: flex;
    justify-content: center;
    align-items: flex-start;

    width: 100%;
    height: 68vh;
    min-height: 380px;

    padding: 4px;
    overflow: auto;

    border: 2px solid #64748b;
    border-radius: 8px;
    background: #1e293b;

    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}

canvas {
    display: block;
    flex: none;
    max-width: none;

    cursor: crosshair;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 12px;
}

.card {
    padding: 9px;
    border-radius: 8px;
    background: white;
    box-shadow: 0 2px 8px #0002;
    display: flex;
    flex-direction: column;
}

.card img {
    width: 100%;
    height: 145px;
    object-fit: contain;
    border: 1px solid #ddd;
    background: #f8fafc;
    cursor: pointer;
}

.card p {
    margin: 6px 0;
    font-size: 13px;
}

.card-name-input {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
}

.card-name-input:focus {
    border-color: #2563eb;
}

.card-actions {
    display: flex;
    gap: 6px;
    margin-top: auto;
}

.card-actions button {
    flex: 1;
}

.empty {
    padding: 20px;
    border: 2px dashed #94a3b8;
    border-radius: 8px;
    text-align: center;
    background: white;
    grid-column: 1 / -1;
}

@media (max-width: 600px) {
    body {
        padding: 7px;
    }

    h1 {
        font-size: 21px;
    }

    .info {
        padding: 8px;
        font-size: 13px;
    }

    .toolbar {
        grid-template-columns: repeat(2, 1fr);
    }

    button,
    .file-button {
        min-height: 48px;
        font-size: 13px;
    }

    .stage {
        height: 65vh;
        min-height: 350px;
        border-width: 1px;
    }

    .results {
        grid-template-columns: 1fr;
    }

    .card img {
        height: auto;
        max-height: 250px;
    }
}

@media (max-width: 370px) {
    .toolbar {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<main class="container">

    <h1>Multiple Images Cropper</h1>

    <div class="info">
        ایک ساتھ متعدد تصاویر منتخب کریں۔ تصویر پر drag کرکے crop بنائیں،
        rectangle کو اندر سے move کریں، corners سے resize کریں اور
        سرخ <strong>×</strong> سے delete کریں۔ ہر کراپ کا انفرادی نام نیچے کارڈ میں لکھ سکتے ہیں۔
    </div>

    <div class="toolbar">

        <label class="file-button" for="imageInput">
            Choose Images
        </label>

        <input
            id="imageInput"
            type="file"
            accept="image/*"
            multiple
        >

        <button id="previousButton" disabled>
            Previous
        </button>

        <button id="nextButton" disabled>
            Next
        </button>

        <button id="fitButton" disabled>
            Fit Image
        </button>

        <button id="actualButton" class="secondary" disabled>
            Actual Size
        </button>

        <button id="undoButton" class="secondary" disabled>
            Undo
        </button>

        <button id="clearButton" class="danger" disabled>
            Clear Crops
        </button>

        <button id="downloadAllButton" disabled>
            Download Current Crops ZIP
        </button>

        <button id="downloadEverythingButton" class="success" disabled>
            Download All Crops ZIP
        </button>

        <button id="downloadOriginalsButton" class="secondary" disabled>
            Download Original Images
        </button>

    </div>

    <div id="status" class="status">
        No images selected.
    </div>

    <div id="stage" class="stage">
        <canvas id="canvas"></canvas>
    </div>

    <h2>Cropped Areas</h2>

    <div id="results" class="results">
        <div class="empty">
            Crop previews will appear here.
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const results = document.getElementById("results");
const statusBox = document.getElementById("status");

const imageInput = document.getElementById("imageInput");
const previousButton = document.getElementById("previousButton");
const nextButton = document.getElementById("nextButton");
const fitButton = document.getElementById("fitButton");
const actualButton = document.getElementById("actualButton");
const undoButton = document.getElementById("undoButton");
const clearButton = document.getElementById("clearButton");
const downloadAllButton = document.getElementById("downloadAllButton");
const downloadEverythingButton = document.getElementById("downloadEverythingButton");
const downloadOriginalsButton = document.getElementById("downloadOriginalsButton");

const image = new Image();

let images = [];
let currentImageIndex = -1;
let rectangles = [];
let selectedIndex = -1;

let mode = null;
let startPoint = null;
let currentRectangle = null;
let originalRectangle = null;
let resizeHandle = null;

const isTouch =
    matchMedia("(pointer: coarse)").matches ||
    "ontouchstart" in window;

const minimumSize = isTouch ? 20 : 10;
const handleSize = isTouch ? 22 : 14;
const hitSize = isTouch ? 28 : 15;
const closeRadius = isTouch ? 19 : 14;

/* Clean and format string without underscores */
function sanitizeName(str) {
    if (!str) return "";
    return str
        .replace(/\.[^/.]+$/, "")
        .replace(/_/g, "-")
        .replace(/[^a-zA-Z0-9-]/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");
}

/* Generate File Name Logic for individual crop */
function getFinalCropName(originalName, cropIndex, totalCropsCount, customName) {
    // 1. MANUAL INDIVIDUAL NAME
    if (customName && customName.trim() !== "") {
        const cleanCustom = sanitizeName(customName);
        return `${cleanCustom}.png`;
    }

    // 2. AUTO FALLBACK NAME
    const cleanOriginal = sanitizeName(originalName) || "crop";
    if (totalCropsCount === 1) {
        return `${cleanOriginal}-crop.png`;
    }
    return `${cleanOriginal}-crop-${cropIndex + 1}.png`;
}

/* Select multiple images */
imageInput.addEventListener("change", function (event) {
    images.forEach(function (item) {
        URL.revokeObjectURL(item.url);
    });

    images = Array.from(event.target.files)
        .filter(function (file) {
            return file.type.startsWith("image/");
        })
        .map(function (file) {
            return {
                name: file.name,
                url: URL.createObjectURL(file),
                selections: []
            };
        });

    if (!images.length) {
        alert("Please select valid image files.");
        return;
    }

    currentImageIndex = 0;
    openCurrentImage();
});

/* Open selected image */
function openCurrentImage() {
    if (currentImageIndex < 0) return;

    const item = images[currentImageIndex];

    image.onload = function () {
        fitImage();

        rectangles = item.selections.map(function (selection) {
            return {
                x: selection.x * canvas.width,
                y: selection.y * canvas.height,
                width: selection.width * canvas.width,
                height: selection.height * canvas.height,
                customName: selection.customName || ""
            };
        });

        selectedIndex = -1;
        render();
    };

    image.src = item.url;
}

/* Save crop rectangles & individual names */
function saveCurrentSelections() {
    if (currentImageIndex < 0 || !canvas.width) return;

    images[currentImageIndex].selections =
        rectangles.map(function (rectangle) {
            return {
                x: rectangle.x / canvas.width,
                y: rectangle.y / canvas.height,
                width: rectangle.width / canvas.width,
                height: rectangle.height / canvas.height,
                customName: rectangle.customName || ""
            };
        });
}

/* Image navigation */
previousButton.addEventListener("click", function () {
    if (currentImageIndex <= 0) return;

    saveCurrentSelections();
    currentImageIndex--;
    openCurrentImage();
});

nextButton.addEventListener("click", function () {
    if (currentImageIndex >= images.length - 1) return;

    saveCurrentSelections();
    currentImageIndex++;
    openCurrentImage();
});

/* Fit image in workspace */
function fitImage() {
    if (!image.naturalWidth) return;

    const availableWidth = stage.clientWidth - 12;
    const availableHeight = stage.clientHeight - 12;

    const scale = Math.min(
        1,
        availableWidth / image.naturalWidth,
        availableHeight / image.naturalHeight
    );

    resizeCanvas(scale);
}

/* Show original image size */
actualButton.addEventListener("click", function () {
    resizeCanvas(1);
});

fitButton.addEventListener("click", fitImage);

/* Resize canvas and preserve rectangles */
function resizeCanvas(scale) {
    const oldWidth = canvas.width;
    const oldHeight = canvas.height;

    const newWidth = Math.max(
        1,
        Math.round(image.naturalWidth * scale)
    );

    const newHeight = Math.max(
        1,
        Math.round(image.naturalHeight * scale)
    );

    if (oldWidth && oldHeight && rectangles.length) {
        const scaleX = newWidth / oldWidth;
        const scaleY = newHeight / oldHeight;

        rectangles.forEach(function (rectangle) {
            rectangle.x *= scaleX;
            rectangle.y *= scaleY;
            rectangle.width *= scaleX;
            rectangle.height *= scaleY;
        });
    }

    canvas.width = newWidth;
    canvas.height = newHeight;

    draw();
}

/* Pointer coordinates */
function getPoint(event) {
    const bounds = canvas.getBoundingClientRect();

    return {
        x: Math.max(
            0,
            Math.min(
                canvas.width,
                (event.clientX - bounds.left) *
                canvas.width / bounds.width
            )
        ),

        y: Math.max(
            0,
            Math.min(
                canvas.height,
                (event.clientY - bounds.top) *
                canvas.height / bounds.height
            )
        )
    };
}

function normalize(point1, point2) {
    return {
        x: Math.min(point1.x, point2.x),
        y: Math.min(point1.y, point2.y),
        width: Math.abs(point2.x - point1.x),
        height: Math.abs(point2.y - point1.y)
    };
}

function getHandles(rectangle) {
    return [
        { name: "nw", x: rectangle.x, y: rectangle.y },
        { name: "ne", x: rectangle.x + rectangle.width, y: rectangle.y },
        { name: "se", x: rectangle.x + rectangle.width, y: rectangle.y + rectangle.height },
        { name: "sw", x: rectangle.x, y: rectangle.y + rectangle.height }
    ];
}

function getClosePoint(rectangle) {
    return {
        x: rectangle.x + rectangle.width,
        y: rectangle.y
    };
}

/* Find close, resize or move target */
function findTarget(point) {
    for (
        let index = rectangles.length - 1;
        index >= 0;
        index--
    ) {
        const rectangle = rectangles[index];
        const closePoint = getClosePoint(rectangle);

        if (
            Math.hypot(
                point.x - closePoint.x,
                point.y - closePoint.y
            ) <= closeRadius + 8
        ) {
            return { type: "close", index: index };
        }

        for (const handle of getHandles(rectangle)) {
            if (
                Math.abs(point.x - handle.x) <= hitSize &&
                Math.abs(point.y - handle.y) <= hitSize
            ) {
                return {
                    type: "resize",
                    index: index,
                    handle: handle.name
                };
            }
        }

        if (
            point.x >= rectangle.x - hitSize &&
            point.x <= rectangle.x + rectangle.width + hitSize &&
            point.y >= rectangle.y - hitSize &&
            point.y <= rectangle.y + rectangle.height + hitSize
        ) {
            return { type: "move", index: index };
        }
    }

    return null;
}

/* Start draw, move, resize or delete */
canvas.addEventListener("pointerdown", function (event) {
    if (!image.naturalWidth) return;

    event.preventDefault();

    const point = getPoint(event);
    const target = findTarget(point);

    startPoint = point;

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch (error) {}

    if (!target) {
        selectedIndex = -1;
        mode = "draw";

        currentRectangle = {
            x: point.x,
            y: point.y,
            width: 0,
            height: 0,
            customName: ""
        };
    } else {
        selectedIndex = target.index;

        if (target.type === "close") {
            rectangles.splice(target.index, 1);
            selectedIndex = -1;
            mode = null;

            saveCurrentSelections();
            render();
            return;
        }

        mode = target.type;
        resizeHandle = target.handle;

        originalRectangle = {
            ...rectangles[selectedIndex]
        };
    }

    draw();
});

canvas.addEventListener("pointermove", function (event) {
    const point = getPoint(event);

    if (!mode) {
        updateCursor(point);
        return;
    }

    event.preventDefault();

    if (mode === "draw") {
        currentRectangle = normalize(startPoint, point);
    }

    if (mode === "move") {
        moveRectangle(point);
    }

    if (mode === "resize") {
        resizeRectangle(point);
    }

    draw();
});

canvas.addEventListener("pointerup", finishAction);
canvas.addEventListener("pointercancel", finishAction);

function finishAction(event) {
    if (
        mode === "draw" &&
        currentRectangle &&
        currentRectangle.width >= minimumSize &&
        currentRectangle.height >= minimumSize
    ) {
        currentRectangle.customName = "";
        rectangles.push(currentRectangle);
        selectedIndex = rectangles.length - 1;
    }

    mode = null;
    currentRectangle = null;
    originalRectangle = null;
    resizeHandle = null;

    try {
        canvas.releasePointerCapture(event.pointerId);
    } catch (error) {}

    saveCurrentSelections();
    render();
}

/* Move rectangle */
function moveRectangle(point) {
    const rectangle = rectangles[selectedIndex];

    rectangle.x = Math.max(
        0,
        Math.min(
            canvas.width - rectangle.width,
            originalRectangle.x + point.x - startPoint.x
        )
    );

    rectangle.y = Math.max(
        0,
        Math.min(
            canvas.height - rectangle.height,
            originalRectangle.y + point.y - startPoint.y
        )
    );
}

/* Resize rectangle */
function resizeRectangle(point) {
    let fixedPoint;

    if (resizeHandle === "nw") {
        fixedPoint = {
            x: originalRectangle.x + originalRectangle.width,
            y: originalRectangle.y + originalRectangle.height
        };
    }

    if (resizeHandle === "ne") {
        fixedPoint = {
            x: originalRectangle.x,
            y: originalRectangle.y + originalRectangle.height
        };
    }

    if (resizeHandle === "se") {
        fixedPoint = {
            x: originalRectangle.x,
            y: originalRectangle.y
        };
    }

    if (resizeHandle === "sw") {
        fixedPoint = {
            x: originalRectangle.x + originalRectangle.width,
            y: originalRectangle.y
        };
    }

    const resized = normalize(fixedPoint, point);

    if (
        resized.width >= minimumSize &&
        resized.height >= minimumSize
    ) {
        resized.customName = rectangles[selectedIndex].customName || "";
        rectangles[selectedIndex] = resized;
    }
}

/* Draw main image */
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!image.naturalWidth) return;

    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

    rectangles.forEach(function (rectangle, index) {
        drawRectangle(rectangle, index, index === selectedIndex);
    });

    if (currentRectangle) {
        drawRectangle(currentRectangle, rectangles.length, true);
    }
}

function drawRectangle(rectangle, index, selected) {
    ctx.save();

    ctx.fillStyle = selected ? "rgba(37,99,235,.22)" : "rgba(16,185,129,.18)";
    ctx.strokeStyle = selected ? "#2563eb" : "#059669";
    ctx.lineWidth = selected ? 4 : 3;

    ctx.fillRect(rectangle.x, rectangle.y, rectangle.width, rectangle.height);
    ctx.strokeRect(rectangle.x, rectangle.y, rectangle.width, rectangle.height);

    /* Number */
    ctx.fillStyle = selected ? "#2563eb" : "#059669";
    ctx.fillRect(rectangle.x, rectangle.y, 34, 27);

    ctx.fillStyle = "white";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(index + 1, rectangle.x + 17, rectangle.y + 13);

    /* Resize handles */
    if (selected) {
        getHandles(rectangle).forEach(function (handle) {
            ctx.fillStyle = "white";
            ctx.strokeStyle = "#2563eb";
            ctx.lineWidth = 3;

            ctx.fillRect(
                handle.x - handleSize / 2,
                handle.y - handleSize / 2,
                handleSize,
                handleSize
            );

            ctx.strokeRect(
                handle.x - handleSize / 2,
                handle.y - handleSize / 2,
                handleSize,
                handleSize
            );
        });
    }

    drawCloseButton(rectangle);
    ctx.restore();
}

/* Red delete cross */
function drawCloseButton(rectangle) {
    const point = getClosePoint(rectangle);
    const crossSize = isTouch ? 7 : 5;

    ctx.beginPath();
    ctx.arc(point.x, point.y, closeRadius, 0, Math.PI * 2);

    ctx.fillStyle = "#dc2626";
    ctx.fill();

    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(point.x - crossSize, point.y - crossSize);
    ctx.lineTo(point.x + crossSize, point.y + crossSize);

    ctx.moveTo(point.x + crossSize, point.y - crossSize);
    ctx.lineTo(point.x - crossSize, point.y + crossSize);
    ctx.stroke();
}

function updateCursor(point) {
    const target = findTarget(point);

    if (!target) {
        canvas.style.cursor = "crosshair";
    } else if (target.type === "close") {
        canvas.style.cursor = "pointer";
    } else if (target.type === "move") {
        canvas.style.cursor = "move";
    } else {
        canvas.style.cursor =
            target.handle === "nw" || target.handle === "se"
                ? "nwse-resize"
                : "nesw-resize";
    }
}

/* Create original-resolution crop */
function createCrop(rectangle) {
    const scaleX = image.naturalWidth / canvas.width;
    const scaleY = image.naturalHeight / canvas.height;

    const sourceX = Math.round(rectangle.x * scaleX);
    const sourceY = Math.round(rectangle.y * scaleY);

    const sourceWidth = Math.min(
        Math.round(rectangle.width * scaleX),
        image.naturalWidth - sourceX
    );

    const sourceHeight = Math.min(
        Math.round(rectangle.height * scaleY),
        image.naturalHeight - sourceY
    );

    const cropCanvas = document.createElement("canvas");
    cropCanvas.width = Math.max(1, sourceWidth);
    cropCanvas.height = Math.max(1, sourceHeight);

    cropCanvas.getContext("2d").drawImage(
        image,
        sourceX,
        sourceY,
        sourceWidth,
        sourceHeight,
        0,
        0,
        sourceWidth,
        sourceHeight
    );

    return cropCanvas;
}

/* Crop previews with Individual Name Input */
function showPreviews() {
    results.innerHTML = "";

    if (!rectangles.length) {
        results.innerHTML =
            '<div class="empty">Crop previews will appear here.</div>';
        return;
    }

    rectangles.forEach(function (rectangle, index) {
        const crop = createCrop(rectangle);
        const card = document.createElement("div");

        card.className = "card";

        const originalName = images[currentImageIndex].name;
        const autoPlaceholder = getFinalCropName(originalName, index, rectangles.length, "");

        card.innerHTML = `
            <img
                src="${crop.toDataURL("image/png")}"
                alt="Crop ${index + 1}"
            >

            <p>
                <strong>Crop ${index + 1}:</strong> ${crop.width} × ${crop.height} px
            </p>

            <input
                type="text"
                class="card-name-input"
                value="${rectangle.customName || ""}"
                placeholder="Custom Name (e.g. ${autoPlaceholder})"
            >

            <div class="card-actions">
                <button class="download">Download</button>
                <button class="danger remove">Remove</button>
            </div>
        `;

        // Handle individual name typing
        const nameInput = card.querySelector(".card-name-input");
        nameInput.oninput = function (e) {
            rectangles[index].customName = e.target.value;
            saveCurrentSelections();
        };

        card.querySelector(".download").onclick = function () {
            downloadCrop(index);
        };

        card.querySelector(".remove").onclick = function () {
            rectangles.splice(index, 1);
            selectedIndex = -1;

            saveCurrentSelections();
            render();
        };

        card.querySelector("img").onclick = function () {
            selectedIndex = index;
            draw();
        };

        results.appendChild(card);
    });
}

/* Download single crop */
function downloadCrop(index) {
    const crop = createCrop(rectangles[index]);

    crop.toBlob(function (blob) {
        if (!blob) return;

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        const originalName = images[currentImageIndex].name;
        const customName = rectangles[index].customName;

        link.href = url;
        link.download = getFinalCropName(originalName, index, rectangles.length, customName);

        link.click();

        setTimeout(function () {
            URL.revokeObjectURL(url);
        }, 1000);
    }, "image/png");
}

/* Create a crop Blob from any loaded image for ZIP export */
function createCropBlobFromImage(imgObj, selection) {
    return new Promise(function (resolve, reject) {
        const tempImg = new Image();
        tempImg.onload = function () {
            const sourceX = Math.round(selection.x * tempImg.naturalWidth);
            const sourceY = Math.round(selection.y * tempImg.naturalHeight);
            const sourceWidth = Math.min(
                Math.round(selection.width * tempImg.naturalWidth),
                tempImg.naturalWidth - sourceX
            );
            const sourceHeight = Math.min(
                Math.round(selection.height * tempImg.naturalHeight),
                tempImg.naturalHeight - sourceY
            );
            const cropCanvas = document.createElement("canvas");
            cropCanvas.width = Math.max(1, sourceWidth);
            cropCanvas.height = Math.max(1, sourceHeight);
            cropCanvas.getContext("2d").drawImage(
                tempImg,
                sourceX, sourceY, sourceWidth, sourceHeight,
                0, 0, sourceWidth, sourceHeight
            );
            cropCanvas.toBlob(function (blob) {
                if (blob) resolve(blob);
                else reject(new Error("Could not create crop."));
            }, "image/png");
        };
        tempImg.onerror = reject;
        tempImg.src = imgObj.url;
    });
}

function downloadBlob(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
}

function uniqueZipName(name, usedNames) {
    let finalName = name;
    let counter = 2;
    const dot = name.lastIndexOf(".");
    const base = dot >= 0 ? name.slice(0, dot) : name;
    const ext = dot >= 0 ? name.slice(dot) : "";
    while (usedNames.has(finalName.toLowerCase())) {
        finalName = base + "-" + counter + ext;
        counter++;
    }
    usedNames.add(finalName.toLowerCase());
    return finalName;
}

/* Helper function to download crop from any loaded image with individual name */
function downloadCropFromImage(imgObj, selection, cropIndex, totalCropsCount) {
    return new Promise(function (resolve) {
        const tempImg = new Image();
        tempImg.onload = function () {
            const sourceX = Math.round(selection.x * tempImg.naturalWidth);
            const sourceY = Math.round(selection.y * tempImg.naturalHeight);
            const sourceWidth = Math.min(
                Math.round(selection.width * tempImg.naturalWidth),
                tempImg.naturalWidth - sourceX
            );
            const sourceHeight = Math.min(
                Math.round(selection.height * tempImg.naturalHeight),
                tempImg.naturalHeight - sourceY
            );

            const cropCanvas = document.createElement("canvas");
            cropCanvas.width = Math.max(1, sourceWidth);
            cropCanvas.height = Math.max(1, sourceHeight);

            cropCanvas.getContext("2d").drawImage(
                tempImg,
                sourceX,
                sourceY,
                sourceWidth,
                sourceHeight,
                0,
                0,
                sourceWidth,
                sourceHeight
            );

            cropCanvas.toBlob(function (blob) {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");

                    link.href = url;
                    link.download = getFinalCropName(imgObj.name, cropIndex, totalCropsCount, selection.customName);
                    link.click();

                    setTimeout(function () {
                        URL.revokeObjectURL(url);
                    }, 1000);
                }
                resolve();
            }, "image/png");
        };
        tempImg.src = imgObj.url;
    });
}

/* Download all crops of current image as one ZIP */
downloadAllButton.addEventListener("click", async function () {
    if (!rectangles.length || currentImageIndex < 0) return;
    saveCurrentSelections();
    if (typeof JSZip === "undefined") {
        alert("ZIP library could not load. Please check your internet connection and reload the page.");
        return;
    }
    const oldText = downloadAllButton.textContent;
    downloadAllButton.disabled = true;
    downloadAllButton.textContent = "Creating ZIP...";
    try {
        const zip = new JSZip();
        const usedNames = new Set();
        const imgObj = images[currentImageIndex];
        const total = imgObj.selections.length;
        for (let index = 0; index < total; index++) {
            const selection = imgObj.selections[index];
            const blob = await createCropBlobFromImage(imgObj, selection);
            const name = uniqueZipName(
                getFinalCropName(imgObj.name, index, total, selection.customName),
                usedNames
            );
            zip.file(name, blob);
        }
        const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
        downloadBlob(zipBlob, (sanitizeName(imgObj.name) || "image") + "-crops.zip");
    } catch (error) {
        console.error(error);
        alert("ZIP could not be created.");
    } finally {
        downloadAllButton.textContent = oldText;
        updateControls();
    }
});

/* Download all crops from ALL images as one ZIP */
downloadEverythingButton.addEventListener("click", async function () {
    saveCurrentSelections();
    if (typeof JSZip === "undefined") {
        alert("ZIP library could not load. Please check your internet connection and reload the page.");
        return;
    }
    const oldText = downloadEverythingButton.textContent;
    downloadEverythingButton.disabled = true;
    downloadEverythingButton.textContent = "Creating ZIP...";
    try {
        const zip = new JSZip();
        const usedNames = new Set();
        for (let imgIdx = 0; imgIdx < images.length; imgIdx++) {
            const imgObj = images[imgIdx];
            if (!imgObj.selections || !imgObj.selections.length) continue;
            const total = imgObj.selections.length;
            for (let cropIdx = 0; cropIdx < total; cropIdx++) {
                const selection = imgObj.selections[cropIdx];
                const blob = await createCropBlobFromImage(imgObj, selection);
                const name = uniqueZipName(
                    getFinalCropName(imgObj.name, cropIdx, total, selection.customName),
                    usedNames
                );
                zip.file(name, blob);
            }
        }
        const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
        downloadBlob(zipBlob, "all-image-crops.zip");
    } catch (error) {
        console.error(error);
        alert("ZIP could not be created.");
    } finally {
        downloadEverythingButton.textContent = oldText;
        updateControls();
    }
});

/* Download all uploaded original images */
downloadOriginalsButton.addEventListener("click", async function () {
    for (let idx = 0; idx < images.length; idx++) {
        const item = images[idx];
        const link = document.createElement("a");
        link.href = item.url;
        
        // Clean original image filename from underscores
        link.download = sanitizeName(item.name) + "." + (item.name.split('.').pop() || 'png');
        link.click();

        await new Promise(function (resolve) {
            setTimeout(resolve, 300);
        });
    }
});

/* Remove last crop */
undoButton.addEventListener("click", function () {
    rectangles.pop();
    selectedIndex = -1;

    saveCurrentSelections();
    render();
});

/* Remove all crops from current image */
clearButton.addEventListener("click", function () {
    rectangles = [];
    selectedIndex = -1;

    saveCurrentSelections();
    render();
});

/* Keyboard delete */
window.addEventListener("keydown", function (event) {
    if (
        selectedIndex >= 0 &&
        (
            event.key === "Delete" ||
            event.key === "Backspace"
        )
    ) {
        event.preventDefault();

        rectangles.splice(selectedIndex, 1);
        selectedIndex = -1;

        saveCurrentSelections();
        render();
    }
});

/* Update buttons and status */
function updateControls() {
    const loaded = currentImageIndex >= 0;
    const hasCrops = rectangles.length > 0;

    const totalCropsAllImages = images.reduce(function (sum, item) {
        return sum + (item.selections ? item.selections.length : 0);
    }, 0);

    previousButton.disabled = !loaded || currentImageIndex === 0;
    nextButton.disabled = !loaded || currentImageIndex === images.length - 1;

    fitButton.disabled = !loaded;
    actualButton.disabled = !loaded;

    undoButton.disabled = !hasCrops;
    clearButton.disabled = !hasCrops;
    downloadAllButton.disabled = !hasCrops;
    downloadEverythingButton.disabled = totalCropsAllImages === 0;
    downloadOriginalsButton.disabled = images.length === 0;

    if (!loaded) {
        statusBox.textContent = "No images selected.";
        return;
    }

    statusBox.textContent =
        `Image ${currentImageIndex + 1} of ${images.length}: ` +
        `${images[currentImageIndex].name} | ` +
        `${rectangles.length} crop(s) on current image | ` +
        `${totalCropsAllImages} crop(s) total across all images`;
}

function render() {
    draw();
    showPreviews();
    updateControls();
}

/* Prevent mobile context menu */
canvas.addEventListener("contextmenu", function (event) {
    event.preventDefault();
});

/* Refit on orientation change */
window.addEventListener("orientationchange", function () {
    setTimeout(function () {
        if (image.naturalWidth) {
            fitImage();
            render();
        }
    }, 300);
});

updateControls();
</script>
